plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'live.budeme.ptz'
    compileSdk 34

    defaultConfig {
        applicationId 'live.budeme.ptz'
        minSdk 29
        targetSdk 34
        versionCode runNumber
        versionName "0.9.${runNumber}"
    }

    // Release key is private: CI decodes it from the GitHub secret PTZ_KEYSTORE_B64 into PTZ_KEYSTORE,
    // the password comes from the secret PTZ_KEYSTORE_PASSWORD. Without them the build is debug-signed.
    def ks = System.getenv('PTZ_KEYSTORE')
    def ksPass = System.getenv('PTZ_KEYSTORE_PASSWORD')
    def hasKey = ks && ksPass && file(ks).exists()

    signingConfigs {
        if (hasKey) {
            release {
                storeFile file(ks)
                storeType 'pkcs12'
                storePassword ksPass
                keyAlias 'ptz-release'
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
