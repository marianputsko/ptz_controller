plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'live.budeme.ptz'
    compileSdk 34

    defaultConfig {
        applicationId 'live.budeme.ptz'
        minSdk 29
        targetSdk 34
        versionCode runNumber
        versionName "0.1.${runNumber}"
    }

    signingConfigs {
        release {
            // Fixed key so every new build installs over the previous one (settings stay).
            storeFile file('ptz-controller.keystore')
            storePassword 'ptzcontroller'
            keyAlias 'ptz'
            keyPassword 'ptzcontroller'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
