<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>PTZ OBSBOT Controller</title>
<style>
/* Studio control surface: graphite body, backlit keys, tally owns red/green */
:root{
  --body:#171B20;      /* chassis */
  --deck:#1F252C;      /* control deck */
  --key:#2B333C;       /* keycap */
  --key-hi:#36404B;    /* keycap top edge */
  --ink:#DCE2E8;       /* legends */
  --dim:#7E8996;       /* secondary legends */
  --lamp:#F5AE3D;      /* backlit key / selection */
  --lamp-ink:#2A1B05;
  --frame:#F4F6F8;     /* active camera L */
  --ina:#3A434D;       /* inactive camera */
  --pvw:rgba(40,210,105,.34);--pvw-solid:#22C55E;
  --pgm:rgba(255,45,40,.42);--pgm-solid:#FF3A30;
  --r:14px;--fr:11px;--j:15px;
}
*{box-sizing:border-box;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--body);color:var(--ink);font:500 14px/1.25 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:manipulation;font-variant-numeric:tabular-nums}
#app{height:100dvh;display:grid;grid-template-columns:repeat(var(--n,2),1fr);grid-template-rows:auto 1fr;gap:0 12px;
  padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}

/* cameras */
.cam{position:relative;border:3px solid var(--ina);border-radius:var(--r);background:#05070A;aspect-ratio:16/9;width:min(100%,calc(var(--camh,50dvh) * 16 / 9));justify-self:center;transition:border-color .15s}
.cam:not(.notfirst){justify-self:start}.cam:not(.notlast){justify-self:end}
.cam canvas{width:100%;height:100%;object-fit:contain;display:block;border-radius:calc(var(--r) - 3px)}
.cam .tally{position:absolute;inset:0;border-radius:calc(var(--r) - 3px);pointer-events:none;transition:background .12s}
.cam.pvw{--tc:var(--pvw-solid)}.cam.pgm{--tc:var(--pgm-solid)}
/* tally: thick frame inside the preview, the picture itself stays clean */
.cam.pvw .tally,.cam.pgm .tally{box-shadow:inset 0 0 0 var(--tf,15px) var(--tc)}
.cam.pvw .lbl,.cam.pgm .lbl{left:calc(var(--tf,15px) + 12px);top:calc(var(--tf,15px) + 6px)}
.cam.pvw .st,.cam.pgm .st{right:calc(var(--tf,15px) + 12px);top:calc(var(--tf,15px) + 8px)}
.cam.pvw .hist,.cam.pgm .hist{right:calc(var(--tf,15px) + 8px);bottom:calc(var(--tf,15px) + 8px)}
.cam .lbl{position:absolute;left:12px;top:9px;font-size:17px;font-weight:700;letter-spacing:.01em;text-shadow:0 1px 4px #000c}
.cam .st{position:absolute;right:12px;top:11px;font-size:12px;color:#C9D1D9;text-shadow:0 1px 3px #000c}
.cam .tb{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--tf,15px) + 8px);font-size:14px;font-weight:800;letter-spacing:.06em;padding:4px 14px;border-radius:999px;display:none;color:#fff;white-space:nowrap;box-shadow:0 2px 10px #0008}
.cam.pvw .tb,.cam.pgm .tb{display:block;background:var(--tc)}
@media (max-height:560px){.cam{--tf:10px}.cam .tb{font-size:12px;padding:3px 10px}}
.cam:not(.active) .lbl{color:#AEB7C1}
.cam.active{border-color:var(--frame);border-bottom-color:transparent;border-radius:var(--r) var(--r) 0 0;z-index:2}
.cam.active canvas,.cam.active .tally{border-radius:calc(var(--r) - 3px) calc(var(--r) - 3px) 0 0}
.cam.active::after{content:"";position:absolute;left:-3px;right:-3px;top:100%;height:var(--j);border:3px solid var(--frame);border-top:0;border-bottom:0;background:var(--deck)}

.cam .zebra{position:absolute;inset:0;width:100%;height:100%;border-radius:calc(var(--r) - 3px);pointer-events:none;display:none}
.cam .hist{position:absolute;right:10px;bottom:10px;width:150px;height:56px;border-radius:8px;pointer-events:none;display:none}
body.showHist .cam .hist,body.showZebra .cam .zebra{display:block}
.cam.active .zebra{border-radius:calc(var(--r) - 3px) calc(var(--r) - 3px) 0 0}
@media (max-height:560px){.cam .hist{width:110px;height:40px;right:7px;bottom:7px}}

/* rounded inner corner of the L */
.cam .cl,.cam .cr{display:none;position:absolute;z-index:1;pointer-events:none;width:calc(var(--fr) + 3px);height:calc(var(--fr) + 3px);top:calc(100% + var(--j) - var(--fr) - 3px)}
.cam.active.notlast .cr{display:block;left:100%;background:radial-gradient(circle at 100% 0,var(--body) var(--fr),var(--frame) var(--fr) calc(var(--fr) + 3px),var(--deck) calc(var(--fr) + 3px))}
.cam.active.notfirst .cl{display:block;right:100%;background:radial-gradient(circle at 0 0,var(--body) var(--fr),var(--frame) var(--fr) calc(var(--fr) + 3px),var(--deck) calc(var(--fr) + 3px))}
body.three .cam .lbl{font-size:15px}

/* deck */
#panel{grid-column:1/-1;margin-top:9px;border:3px solid var(--frame);border-radius:var(--r);background:var(--deck);display:flex;gap:16px;padding:14px;min-height:0;position:relative}
#panel.first{border-top-left-radius:0}
#panel.last{border-top-right-radius:0}
#liveBan{position:absolute;left:50%;top:-1px;transform:translate(-50%,-50%);z-index:5;display:none;background:var(--pgm-solid);color:#fff;font-weight:700;font-size:13px;padding:4px 14px;border-radius:999px;white-space:nowrap;box-shadow:0 0 16px rgba(255,58,48,.5)}
#panel.isLive #liveBan{display:block}
#panel.isLive .blk{opacity:.32;filter:grayscale(1)}
#liveBan.flash{animation:lb .45s ease 2}
@keyframes lb{50%{transform:translate(-50%,-50%) scale(1.15);box-shadow:0 0 28px rgba(255,58,48,.9)}}
#guardRow{display:flex;gap:10px;align-items:center}
#guardRow label{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px;flex:0 0 auto}
#guardRow select{flex:1;min-width:0}
@media (prefers-reduced-motion:reduce){#liveBan.flash{animation:none}}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.sec{font-size:12px;color:var(--dim);display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-top:2px}
.sec b{color:var(--ink);font-weight:700;font-size:13px}

/* keys */
button{font:inherit;color:var(--ink);background:linear-gradient(var(--key-hi),var(--key) 14%);border:1px solid #11151A;border-radius:10px;padding:10px 8px;box-shadow:0 2px 0 #0D1014;touch-action:manipulation;transition:background .08s,color .08s,transform .05s}
button:active{transform:translateY(1px);box-shadow:0 1px 0 #0D1014}
button.on{background:var(--lamp);color:var(--lamp-ink);border-color:#9C6614;box-shadow:0 0 14px rgba(245,174,61,.35),0 2px 0 #7A4F10}
button:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.row{display:flex;gap:8px}
.row>button{flex:1}

/* pan/tilt */
#ctl{flex:0 0 26%;height:100%;align-items:center;container-type:size;gap:10px}
#ctl #joy,#ctl #pad{width:min(100cqw,100cqh - 46px);aspect-ratio:1;flex:0 0 auto}
#joy{position:relative;border-radius:50%;touch-action:none;
  background:
    radial-gradient(circle,transparent 0 31%,rgba(255,255,255,.05) 31% 31.6%,transparent 32%),
    linear-gradient(transparent 49.6%,rgba(255,255,255,.07) 49.6% 50.4%,transparent 50.4%),
    linear-gradient(90deg,transparent 49.6%,rgba(255,255,255,.07) 49.6% 50.4%,transparent 50.4%),
    radial-gradient(circle at 50% 40%,#252C34,#15191E 70%);
  box-shadow:inset 0 0 0 2px #0F1317,inset 0 6px 18px #0009,0 1px 0 #2E3740}
#knob{position:absolute;width:30%;height:30%;left:35%;top:35%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 50% 35%,#FFFFFF,#C9CFD6 70%);box-shadow:0 6px 14px #000a,inset 0 -3px 6px #0003}
#knob::after{content:"";position:absolute;inset:38%;border-radius:50%;background:var(--lamp);box-shadow:0 0 8px var(--lamp)}
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;touch-action:none}
#pad button{font-size:clamp(16px,4cqw,26px);padding:0;border-radius:12px}
#pad button[data-d="0,0"]{color:var(--dim)}
#ctl.btns #joy,#ctl:not(.btns) #pad{display:none}
button.small{font-size:12px;padding:6px 10px;width:100%;color:var(--dim)}

/* zoom rocker */
#zoomCol{flex:0 0 clamp(46px,5vw,64px);align-items:stretch}
#zoomCol .rock button{font-size:13px;padding:0 2px}
#zv{font-size:15px}
#zoomCol .rock{flex:1;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;box-shadow:0 2px 0 #0D1014;min-height:0}
#zoomCol .rock button{flex:1;border-radius:0;box-shadow:none;font-weight:700}
#zoomCol .rock button+button{border-top:1px solid #11151A}
#zbar{height:6px;border-radius:3px;background:#12161B;overflow:hidden}
#zbar i{display:block;height:100%;width:0;background:var(--frame);transition:width .15s}
#zv{text-align:center;font-size:18px;font-weight:700}

/* right side */
#mid{flex:1;min-height:0;min-width:0;display:flex;gap:16px}
.lcol{flex:1 1 auto;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.tabs{background:#14181D;border-radius:12px;padding:4px;gap:4px}
.tabs button{padding:7px;font-size:13px;background:transparent;box-shadow:none;border-color:transparent;color:var(--dim)}
.tabs button.on{background:var(--key);color:var(--ink);box-shadow:none;border-color:#11151A}
.tp{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.tp[hidden]{display:none}
/* right column: full deck height, button rows share the height so it fits any window */
.scol{flex:0 0 clamp(170px,19vw,240px);display:flex;flex-direction:column;gap:6px;min-height:0;overflow:hidden}
.scol .row{flex:1 1 0;min-height:30px;max-height:52px}
.scol .row>button{padding:0 6px}
.scol #evm,.scol #evp{font-size:17px;font-weight:700}
.scol #aeT{font-size:13px}
.scol input[type=range]{flex:0 0 26px;height:26px}
.gw{flex:1;min-height:0;container-type:size}
.grid3{--tw:min((100cqw - 16px) / 3,(100cqh - 8px) / 2 * 16 / 9);display:grid;grid-template-columns:repeat(3,var(--tw));grid-auto-rows:calc(var(--tw) * 9 / 16);gap:8px;justify-content:start;align-content:start}
.pre{position:relative;min-height:0;padding:0;background:#12161B;background-size:cover;background-position:center;overflow:hidden;border:2px solid #2A323B;box-shadow:none}
.pre.has{border-color:#3A444F}
.pre span{position:absolute;left:6px;top:5px;min-width:22px;height:22px;padding:0 6px;border-radius:7px;background:#000a;font-size:13px;font-weight:700;display:grid;place-items:center}
.pre:not(.has) span{left:50%;top:50%;transform:translate(-50%,-50%);background:none;font-size:20px;color:var(--dim)}
.pre.saving{border-color:var(--lamp);box-shadow:0 0 16px rgba(245,174,61,.5)}
input[type=range]{width:100%;accent-color:var(--frame);height:28px}
#log{font-size:11px;color:var(--dim);min-height:1.2em;max-height:2.5em;overflow:hidden;flex:1;min-width:0}
.foot{display:flex;align-items:center;gap:8px;min-height:24px}
.tabs #setBtn{flex:0 0 46px;font-size:17px;color:var(--ink);padding:4px;position:relative}
/* gamepad mode: 4 presets laid out like the Y / X / B / A buttons */
body.gp .grid3{grid-template-areas:"x y b" "x a b";justify-content:center}
body.gp .pre[data-p="0"]{grid-area:a}body.gp .pre[data-p="1"]{grid-area:b}body.gp .pre[data-p="2"]{grid-area:x}body.gp .pre[data-p="3"]{grid-area:y}
body.gp .pre[data-p="1"],body.gp .pre[data-p="2"]{align-self:center;height:calc(var(--tw) * 9 / 16)}
body.gp .pre[data-p="4"],body.gp .pre[data-p="5"]{display:none}
body.gp .pre span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;border:2px solid #F4F6F8;background:rgba(0,0,0,.6);color:#F4F6F8;padding:0}
.pre.gpHit{outline:3px solid var(--lamp);outline-offset:-3px}
.gpPress{background:var(--lamp)!important;color:var(--lamp-ink)!important;border-color:#9C6614!important}
.pre .gpFill{position:absolute;left:0;bottom:0;height:6px;width:0;background:var(--lamp);pointer-events:none}
#gpName{color:var(--ink)}#gpName.off{color:var(--dim)}
.gphelp{font-size:12px;color:var(--dim);line-height:1.5}
#setBtn.upd::after{content:"";position:absolute;top:4px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--lamp);box-shadow:0 0 8px var(--lamp)}
.updline{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--dim);flex-wrap:wrap}
.updline #updMsg{color:var(--ink)}
.updline #updMsg.new{color:var(--lamp);font-weight:700}

/* settings sheet */
#settings{position:fixed;inset:0;background:#05070Acc;display:none;align-items:center;justify-content:center;z-index:10}
#settings .box{background:var(--deck);border-radius:16px;width:min(980px,94vw);max-height:94dvh;display:flex;flex-direction:column;border:1px solid #2E3740;overflow:hidden}
#settings .shead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid #2A323B}
#settings .shead h2{margin:0}
#langRow{flex:0 0 auto}#langRow button{padding:6px 14px;font-size:13px}
#settings .box{width:min(720px,94vw);height:min(700px,94dvh)}
#settings .sgrid{flex:1 1 auto;padding:16px 18px;overflow:auto;min-height:0}
#settings .spane{display:none;flex-direction:column;gap:18px;min-width:0}#settings .spane.on{display:flex}
#settings .sstrip{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px 0}
#settings .sstrip button{display:flex;align-items:center;gap:8px;padding:6px 12px;min-height:0;border-radius:999px;background:#12161B;border:1px solid #2E3740;box-shadow:none;font-size:13px;color:var(--ink);font-weight:500}
#settings .sstrip i{width:9px;height:9px;border-radius:50%;background:#555}
#settings .sstrip i.ok{background:var(--pvw-solid);box-shadow:0 0 6px var(--pvw-solid)}#settings .sstrip i.bad{background:var(--pgm-solid)}#settings .sstrip i.warn{background:var(--lamp)}
#settings .stabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:12px 18px 0;padding:4px;background:#12161B;border-radius:12px}
#settings .stabs button{background:none;border:0;box-shadow:none;color:var(--dim);font-weight:600;padding:10px 6px;min-height:0;border-radius:9px}
#settings .stabs button.on{background:#2A3139;color:var(--ink)}
#settings .stabs button i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pgm-solid);margin-left:6px;vertical-align:middle}
#zebRow{display:grid;grid-template-columns:1.4fr 1.4fr 4fr;gap:8px}#zebLv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
body:not(.showZebra) #zebLv button{opacity:.4}
#settings .about{font-size:14px;line-height:1.6;color:var(--ink)}#settings .about small{display:block;color:var(--dim);font-size:13px}
#settings .sblk{display:flex;flex-direction:column;gap:10px}
#settings .sblk>label:first-child{font-size:12px;font-weight:700;color:var(--dim);letter-spacing:.02em}
#settings .sfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-top:1px solid #2A323B;background:var(--deck)}
#settings .sfoot .row{flex:0 0 auto}#settings .sfoot .row button{min-width:130px}
#codecInfo{font-size:11px;color:var(--dim);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-height:560px){#settings .shead{padding:8px 14px}#settings .sgrid{padding:10px 14px}#settings .spane{gap:12px}#settings .sstrip{padding:8px 14px 0}#settings .stabs{margin:8px 14px 0}#settings .stabs button{padding:7px 4px}#settings .sfoot{padding:8px 14px}}
#settings h2{margin:0 0 4px;font-size:17px}
#settings label{font-size:13px;color:var(--dim)}
#settings input[type=text]{font:inherit;background:#12161B;color:var(--ink);border:1px solid #2E3740;border-radius:10px;padding:10px;font-size:16px;user-select:text;-webkit-user-select:text}
.row.two>div{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.row.two input,.row.two select{width:100%}
#settings select{font:inherit;font-size:16px;background:#12161B;color:var(--ink);border:1px solid #2E3740;border-radius:10px;padding:10px}
#tMode button{font-size:13px}
#tFields{display:flex;flex-direction:column;gap:10px}
#tFields[hidden]{display:none}
#tdot{flex:0 0 auto;margin-left:auto;font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;cursor:pointer}
#tdot i{width:9px;height:9px;border-radius:50%;background:#555}
#tdot.ok i{background:var(--pvw-solid);box-shadow:0 0 6px var(--pvw-solid)}
#tdot.bad i{background:var(--pgm-solid)}
#tdot.warn i{background:var(--lamp)}
.stat{display:grid;grid-template-columns:12px 1fr;gap:3px 10px;background:#12161B;border:1px solid #2E3740;border-radius:12px;padding:12px}
.stat i{width:10px;height:10px;border-radius:50%;margin-top:4px;background:#555}
.stat i.ok{background:var(--pvw-solid);box-shadow:0 0 6px var(--pvw-solid)}.stat i.bad{background:var(--pgm-solid)}.stat i.warn{background:var(--lamp)}
.stat b{font-size:14px;color:var(--ink)}.stat small{grid-column:2;font-size:12px;color:var(--dim);margin-bottom:6px}
#bridgeNote{font-size:13px;color:var(--dim)}
#swIpBox{display:flex;flex-direction:column;gap:6px}#swIpBox .err{color:var(--bad,#FF3A30);font-size:13px}
label.chk{display:flex;align-items:center;gap:8px;color:var(--ink)!important;font-size:14px!important}
[hidden]{display:none!important}
#ip2Box,#urlBox{display:flex;flex-direction:column;gap:10px}
#settings input[type=text]{width:100%}
body:not(.three) #ip2Box,body:not(.three) .c3{display:none}
#rot{display:none;position:fixed;inset:0;background:var(--body);z-index:20;align-items:center;justify-content:center;font-size:18px;text-align:center;padding:20px}
@media (orientation:portrait){#rot{display:flex}}
#ctl{justify-content:center}
@media (max-height:560px){
  #app{gap:0 8px;padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
  :root{--camh:42dvh}
  .cam .lbl{font-size:14px;left:9px;top:6px}
  .cam .st{top:7px;right:9px;font-size:11px}
  #panel{padding:8px;gap:10px;margin-top:7px}
  :root{--j:13px;--fr:9px}
  button{padding:6px;font-size:13px}
  .col,.tp,.lcol,.scol{gap:5px}
  .scol .row{min-height:26px}
  .sec{font-size:11px;margin:0}
  .tabs{padding:2px}.tabs button{padding:4px;font-size:12px}
  #zv{font-size:13px}
  #ctl #joy,#ctl #pad{width:min(100cqw,100cqh - 36px)}
  #pad{gap:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="cam active" data-i="0"><canvas></canvas><canvas class="zebra" width="256" height="144"></canvas><div class="tally"></div><div class="lbl" data-i18n="cam" data-n="1">Kamera 1</div><canvas class="hist" width="300" height="112"></canvas><div class="tb"></div><div class="st">–</div><i class="cl"></i><i class="cr"></i></div>
  <div class="cam" data-i="1"><canvas></canvas><canvas class="zebra" width="256" height="144"></canvas><div class="tally"></div><div class="lbl" data-i18n="cam" data-n="2">Kamera 2</div><canvas class="hist" width="300" height="112"></canvas><div class="tb"></div><div class="st">–</div><i class="cl"></i><i class="cr"></i></div>
  <div class="cam" data-i="2"><canvas></canvas><canvas class="zebra" width="256" height="144"></canvas><div class="tally"></div><div class="lbl" data-i18n="cam" data-n="3">Kamera 3</div><canvas class="hist" width="300" height="112"></canvas><div class="tb"></div><div class="st">–</div><i class="cl"></i><i class="cr"></i></div>
  <div id="panel" class="l0">
    <div id="liveBan" role="status"></div>
    <div id="ctl" class="col">
      <div id="joy"><div id="knob"></div></div>
      <div id="pad">
        <button data-d="-1,-1">↖</button><button data-d="0,-1">↑</button><button data-d="1,-1">↗</button>
        <button data-d="-1,0">←</button><button data-d="0,0">■</button><button data-d="1,0">→</button>
        <button data-d="-1,1">↙</button><button data-d="0,1">↓</button><button data-d="1,1">↘</button>
      </div>
      <button id="ctlToggle" class="small"></button>
    </div>

let CODEC=null;
async function pickCodec(){
  if(!('VideoDecoder' in window))return null;
  for(const c of ['hvc1.1.6.L153.B0','hev1.1.6.L153.B0','hvc1.1.6.L150.B0','hvc1.1.6.L123.B0','hvc1.2.4.L153.B0']){
    try{const s=await VideoDecoder.isConfigSupported({codec:c});if(s.supported)return c}catch(e){}
  }return null;
}
function findStart(u,from){for(let i=from;i<u.length-4;i++){if(u[i]===0&&u[i+1]===0&&(u[i+2]===1||(u[i+2]===0&&u[i+3]===1)))return i}return -1}
function extract(u){
  if(u.length<32)return null;
  const L=(u[12]|(u[13]<<8)|(u[14]<<16)|(u[15]<<24))>>>0;
  let s=(L>0&&L<=u.length)?u.length-L:-1;
  if(s<0||findStart(u,s)!==s)s=findStart(u,0);
  return s<0?null:u.subarray(s);
}
function isKey(p){
  let i=0;
  while((i=findStart(p,i))>=0){const off=p[i+2]===1?3:4;const t=(p[i+off]>>1)&63;if((t>=16&&t<=21)||t===32)return true;i+=off;if(i>400)break}
  return false;
}
class CamView{
  constructor(i,el){this.i=i;this.lastFrame=0;this.fps=0;this.el=el;this.cv=el.querySelector('canvas');this.ctx=this.cv.getContext('2d');this.st=el.querySelector('.st');this.hctx=el.querySelector('.hist').getContext('2d');this.zctx=el.querySelector('.zebra').getContext('2d');this.ws=null;this.dec=null;this.wait=true;this.ts=0;this.frames=0;this.retry=null;this.alive=0;
    setInterval(()=>{if(this.ws&&this.ws.readyState===1){this.fps=this.frames;this.st.textContent=`${this.frames} fps`;this.frames=0}},1000);}
  status(t){this.st.textContent=t}
  makeDecoder(){
    if(this.dec&&this.dec.state!=='closed')try{this.dec.close()}catch(e){}
    this.dec=new VideoDecoder({output:f=>{if(this.cv.width!==f.displayWidth){this.cv.width=f.displayWidth;this.cv.height=f.displayHeight}this.ctx.drawImage(f,0,0);f.close();this.frames++;this.lastFrame=Date.now();this.cv.dataset.live=1},
      error:e=>{log(`CAM${this.i+1} decoder: ${e.message}`);this.wait=true;setTimeout(()=>this.makeDecoder(),100)}});
    this.dec.configure({codec:CODEC,optimizeForLatency:true});this.wait=true;
  }
  connect(){
    clearTimeout(this.retry);
    if(this.ws){this.ws.onclose=null;try{this.ws.close()}catch(e){}}
    if(!CODEC){this.status(window.isSecureContext?tr('stNoCodec'):tr('stLocal'));return}
    this.makeDecoder();this.status(tr('stConn'));
    const ws=new WebSocket(`ws://${cfg.ips[this.i]}:9001`);ws.binaryType='arraybuffer';this.ws=ws;
    ws.onopen=()=>this.status(tr('stWait'));
    ws.onmessage=e=>{
      if(typeof e.data==='string')return;
      const p=extract(new Uint8Array(e.data));if(!p)return;
      const key=isKey(p);
      if(this.wait){if(!key)return;this.wait=false}
      if(this.dec.state!=='configured')return;
      if(this.dec.decodeQueueSize>4){this.wait=true;return}
      this.ts+=33333;
      try{this.dec.decode(new EncodedVideoChunk({type:key?'key':'delta',timestamp:this.ts,data:p}))}catch(err){this.wait=true}
    };
    ws.onerror=()=>this.status(tr('stErr'));
    ws.onclose=()=>{this.status(tr('stRetry'));this.retry=setTimeout(()=>this.connect(),2000)};
  }
}

const anaCv=document.createElement('canvas');anaCv.width=256;anaCv.height=144;
const anaCtx=anaCv.getContext('2d',{willReadFrequently:true});
let ZEBRA=230; // luma threshold, set from settings
let zPhase=0;
function analyze(v){
  const hOn=document.body.classList.contains('showHist'),zOn=document.body.classList.contains('showZebra');
  if((!hOn&&!zOn)||!v.cv.dataset.live||!v.cv.width)return;
  const W=anaCv.width,H=anaCv.height;anaCtx.drawImage(v.cv,0,0,W,H);
  const d=anaCtx.getImageData(0,0,W,H).data;const bins=new Uint32Array(64);
  let zImg=null,zd=null;if(zOn){zImg=v.zctx.createImageData(W,H);zd=zImg.data}
  for(let p=0,k=0;p<d.length;p+=4,k++){
    const y=(54*d[p]+183*d[p+1]+19*d[p+2])>>8;bins[y>>2]++;
    if(zd&&y>=ZEBRA){const x=k%W,yy=(k/W)|0;if(((x+yy+zPhase)&7)<3){zd[p]=255;zd[p+1]=255;zd[p+2]=255;zd[p+3]=200}else{zd[p+3]=110}}
  }
  if(zd)v.zctx.putImageData(zImg,0,0);
  if(hOn)drawHist(v,bins,W*H);
}
function drawHist(v,bins,total){
  const c=v.hctx,w=c.canvas.width,h=c.canvas.height;c.clearRect(0,0,w,h);
  c.fillStyle='rgba(5,7,10,.78)';c.beginPath();c.roundRect(0,0,w,h,14);c.fill();
  let max=0;for(let i=1;i<63;i++)max=Math.max(max,bins[i]);max=Math.max(max,1);
  const pad=8,bw=(w-pad*2)/64;c.fillStyle='rgba(244,246,248,.85)';
  for(let i=0;i<64;i++){const bh=Math.min(1,bins[i]/max)*(h-pad*2);c.fillRect(pad+i*bw,h-pad-bh,Math.ceil(bw),bh)}
  for(const q of [.25,.5,.75]){c.fillStyle=q===.5?'rgba(255,255,255,.3)':'rgba(255,255,255,.22)';c.fillRect(Math.round(pad+q*(w-pad*2)),pad,1,h-pad*2)}
  // clipping warnings: >1.5 % of pixels in the extreme bin
  const lo=bins[0]/total,hi=bins[63]/total;
  if(hi>0.015){c.fillStyle='#FF3A30';c.fillRect(w-pad-4,pad,4,h-pad*2)}
  if(lo>0.015){c.fillStyle='#4D8DFF';c.fillRect(pad,pad,4,h-pad*2)}
}

// and on release stop it where it actually is (GET current ratio, then PUT that ratio).
// Camera zoom speed is 0–10; it follows the shared speed slider (5–100), 40 ≈ 5.
const zoomSpeed=(f=1)=>Math.max(1,Math.min(10,Math.round((1+cfg.speed*9/100)*f)));

function zoomStart(d,f=1){const sp=zoomSpeed(f);if(zDir===d&&zSpd===sp&&zCam===active)return;
  const fresh=zDir!==d||zCam!==active;zDir=d;zSpd=sp;zCam=active;
  zRamp.forEach(clearTimeout);zRamp=[];
  if(fresh){ // soft start: ramp up to the chosen speed over ~0.3 s
    zLast={r:zoom[active],t:Date.now()};readZoom(active);
    const steps=[Math.max(1,Math.round(sp/3)),Math.max(1,Math.round(sp*2/3)),sp];
    steps.forEach((v,k)=>zRamp.push(setTimeout(()=>{if(zDir===d&&zCam===active)zoomPut(active,d>0?12:1,v)},k*120)));

// tally: always from the PTZ Bridge program (served from it, or reached at a configured address)
let tallyTimer=null,tallyBusy=false,tallyFails=0,manualTally=false;
let BRIDGE=null,bridgeOk=null,BASE=null,SAME=false,EMB=false; // EMB = running inside the Android app (built-in tally)
 // bridge status / reachable / base url / page served by it
const tallyInfo={reach:null,j:null};     // last /tally result
function tallyUrl(){return (BASE??'')+'/tally'}
function normBridge(v){v=(v||'').trim().replace(/\/+$/,'').replace(/\/(tally|admin)$/,'');if(!v)return '';if(!/^https?:\/\//.test(v))v='http://'+v;if(!/:\d+$/.test(v.replace(/^https?:\/\//,'')))v+=':8080';return v}
function applyTally(j){
  if(manualTally)return;
  if(!j||!j.connected){camEls.forEach((_,i)=>setTally(i,''));return}
  const pg=j.program||[],pv=j.preview||[];
  cfg.tally.inputs.slice(0,NCAM).forEach((inp,i)=>setTally(i,pg.includes(inp)?'pgm':pv.includes(inp)?'pvw':''));
}
async function pollTally(){
  if(tallyBusy)return;tallyBusy=true;
  const ac=new AbortController();const to=setTimeout(()=>ac.abort(),1200);
  try{
    const r=await fetch(tallyUrl(),{cache:'no-store',signal:ac.signal});const j=await r.json();
    tallyFails=0;tallyInfo.reach=true;tallyInfo.j=j;applyTally(j);
  }catch(e){
    if(++tallyFails>=3){tallyInfo.reach=false;tallyInfo.j=null;applyTally(null)}
  }finally{clearTimeout(to);tallyBusy=false}
}
function startTally(){clearInterval(tallyTimer);tallyInfo.reach=null;tallyInfo.j=null;tallyFails=0;
  if(cfg.tally.mode==='none'){applyTally(null);return}
  pollTally();tallyTimer=setInterval(pollTally,300)}
async function detectBridge(){
  SAME=false;BASE=null;BRIDGE=null;bridgeOk=null;
  if(location.protocol!=='http:'||!location.host){await probeBase(normBridge(cfg.tally.bridge)||'http://localhost:8080');return}
  try{const r=await fetch('/api/status',{cache:'no-store'});const j=await r.json();if(j.app==='ptz-bridge'){BRIDGE=j;bridgeOk=true;BASE='';SAME=true;EMB=!!j.embedded}}catch(e){}
  if(!SAME&&cfg.tally.bridge)await probeBase(normBridge(cfg.tally.bridge));
}
async function probeBase(b){BASE=b;const ac=new AbortController();const to=setTimeout(()=>ac.abort(),1500);
  try{const j=await (await fetch(b+'/api/status',{cache:'no-store',signal:ac.signal})).json();if(j.app==='ptz-bridge'){BRIDGE=j;bridgeOk=true}else bridgeOk=false}catch(e){bridgeOk=false}finally{clearTimeout(to)}}
async function pollBridge(){if(BASE===null)return;
  const ac=new AbortController();const to=setTimeout(()=>ac.abort(),1500);
  try{const j=await (await fetch(BASE+'/api/status',{cache:'no-store',signal:ac.signal})).json();if(j.app==='ptz-bridge'){BRIDGE=j;bridgeOk=true}}catch(e){bridgeOk=false}finally{clearTimeout(to)}}

const LV={ok:0,'':1,warn:2,bad:3};
function statusRows(){
  const rows=[],swName=m=>m==='atem'?'ATEM':m==='vmix'?'vMix':m==='osee'?'OSEE':'';
  const where=BASE?BASE.replace(/^https?:\/\//,''):'';
  if(cfg.tally.mode==='none'&&!SAME){}
  else if(EMB){}
  else if(bridgeOk)rows.push({l:'ok',t:tr('rBridgeOk'),d:BRIDGE&&BRIDGE.host?BRIDGE.host+(where?' · '+where:''):where});
  else if(bridgeOk===false)rows.push({l:'bad',t:tr('rBridgeNo'),d:SAME?tr('rBridgeNoSame'):tr('rBridgeNoAddr',{n:where})});
  if(cfg.tally.mode==='none')rows.push({l:'',t:tr('rTallyOff'),d:tr('rTallyOffD')});
  else{
    const j=tallyInfo.j;
    if(bridgeOk===false){}
    else if(tallyInfo.reach===null||!j)rows.push({l:'',t:tr('rSwWait'),d:''});
    else if(j.switcher&&j.switcher!=='none'&&j.switcher!==cfg.tally.mode)rows.push({l:'warn',t:tr('rSwMismatch',{n:swName(j.switcher),p:swName(cfg.tally.mode)}),d:tr('rSwMismatchD')});
    else if(j.switcher==='none')rows.push({l:'bad',t:tr('rSwNone'),d:tr('rSwNoneD')});
    else if(j.connected)rows.push({l:'ok',t:tr('rSwOk',{n:j.model||swName(cfg.tally.mode)}),d:''});
    else rows.push({l:'bad',t:tr('rSwBad'),d:(LANG==='sk'&&BRIDGE&&BRIDGE.switcher&&BRIDGE.switcher.error)||tr('rSwBadD')});
  }
  rows.forEach(r=>r.k='sw');
  views.forEach((v,i)=>{
    const h=health[i],ip=cfg.ips[i],video=Date.now()-v.lastFrame<3000;
    if(h.api===false&&!video)rows.push({l:'bad',t:tr('rCamDown',{n:i+1}),d:tr('rCamDownD',{p:ip})});
    else if(h.api&&video)rows.push({l:'ok',t:tr('rCamOk',{n:i+1}),d:tr('rCamOkD',{p:ip,f:v.fps})});
    else if(h.api&&!video)rows.push({l:'warn',t:tr('rCamNoVid',{n:i+1}),d:!CODEC?(window.isSecureContext?tr('rCamNoVidCodec'):/Android/i.test(navigator.userAgent)?tr('rCamNoVidAndroid',{n:location.origin}):tr('rCamNoVidSecure')):tr('rCamNoVidBusy')});
    else if(!h.api&&video)rows.push({l:'warn',t:tr('rCamNoApi',{n:i+1}),d:tr('rCamNoApiD',{p:ip})});
    else rows.push({l:'',t:tr('rCamConn',{n:i+1}),d:ip});
    rows[rows.length-1].k=i;
  });
  return rows;
}

// ---- updates: check GitHub once a day, only notify; never changes anything on its own ----
const UPD_REPO='marianputsko/ptz_controller';
const upd=Object.assign({on:true,skip:'',last:0,latest:''},store.get('upd',{}));
let updState='',updNote='';
function vnum(v){return String(v||'').replace(/^v/,'').split('.').map(n=>parseInt(n,10)||0)}
function newer(a,b){a=vnum(a);b=vnum(b);for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d>0}return false}
const updAvail=()=>!!upd.latest&&newer(upd.latest,APP_VERSION);
async function checkUpd(force){
  if(!upd.on&&!force){renderUpd();return}
  if(!force&&Date.now()-upd.last<20*3600e3){renderUpd();return}
  updState='checking';updNote='';renderUpd();
  try{const r=await fetch('https://api.github.com/repos/'+UPD_REPO+'/releases/latest',{cache:'no-store'});if(!r.ok)throw 0;
    const j=await r.json();upd.latest=String(j.tag_name||'').replace(/^v/,'');upd.last=Date.now();store.set('upd',upd);updState=''}
  catch(e){updState='offline'}
  renderUpd()}
function renderUpd(){
  $('#setBtn').classList.toggle('upd',upd.on&&updAvail()&&upd.latest!==upd.skip);
  $('#updOn').checked=upd.on;$('#updCur').textContent=tr('updCur',{n:APP_VERSION});
  const m=$('#updMsg');m.className='';let t='';
  if(updNote)t=updNote;
  else if(updState==='checking')t=tr('updChecking');
  else if(updAvail()){t=upd.latest===upd.skip?tr('updSkipped',{n:upd.latest}):tr('updNew',{n:upd.latest});m.className='new'}
  else if(updState==='offline')t=tr('updOffline');
  else if(!upd.on)t=tr('updOff');
  else if(upd.latest)t=tr('updNone');
  m.textContent=t;
  $('#updBtns').hidden=!updAvail();$('#updSkip').hidden=upd.latest===upd.skip;
}

  updNote=code==='progress'?tr('updDl',{n:info||''}):code==='perm'?tr('updPerm'):code==='confirm'?tr('updConfirm'):code==='error'?tr('updErr',{n:info||''}):'';renderUpd()};

  const x=p.axes[0]||0,y=p.axes[1]||0,act=Math.hypot(x,y)>0.15;
  if(jId===null){
    if(act&&gpAllowed('move')){gpMoving=true;jx=x;jy=y;drawKnob();if(!sendT){sendMove();sendT=setInterval(sendMove,120)}}
    else if(gpMoving){gpMoving=false;stopMove()}
  }
  // right stick: only the axis pushed further counts (up/down = zoom, left/right = speed)
  const rx=p.axes[2]||0,ry=-(p.axes[3]||0),rsZoom=Math.abs(ry)>=Math.abs(rx);
  // zoom: RT tele / LT wide (analog), or right stick up/down; speed follows the speed slider
  let z=val(GP_BTN.RT)-val(GP_BTN.LT);if(rsZoom&&Math.abs(ry)>Math.abs(z))z=ry;
  // analog: how far the trigger/stick is pressed scales the zoom speed; release stops at once
  if(Math.abs(z)>0.12&&gpAllowed('move')){if(Date.now()-gpLastZoom>150){gpLastZoom=Date.now();zoomStart(z>0?1:-1,Math.abs(z))}gpFlash(z>0?'#zin':'#zout',260)}
  else if(zDir&&gpZooming){zoomStop()}
  gpZooming=Math.abs(z)>0.12;
  // speed: right stick left/right moves the slider
  if(!rsZoom&&Math.abs(rx)>0.2&&Date.now()-gpLastSpeed>70){gpLastSpeed=Date.now();
    const v=Math.min(100,Math.max(5,cfg.speed+Math.round(rx*3)));if(v!==cfg.speed){cfg.speed=v;sp.value=v;sv.textContent=v;store.set('speed',v)}}
  // presets: short press = recall (on release), hold = save
  for(const k in GP_PRE){const id=GP_PRE[k],bi=+k,h=gpHold[id];
    if(edge(bi)){gpHold[id]=gpAllowed('pre')?{t:Date.now(),saved:false}:null;continue}
    if(!h)continue;
    if(down(bi)){if(!h.saved){const f=Math.min(1,(Date.now()-h.t)/GP_SAVE_MS);gpFill(id,f);if(f>=1){h.saved=true;gpFill(id,0);gpHit(id);gpSavePreset(id)}}}
    else{gpFill(id,0);if(!h.saved&&gpAllowed('pre')){gpHit(id);api(active,'PUT','ptz/preset',{operation:'call',id})}gpHold[id]=null}}
  // cameras
  if(edge(GP_BTN.LB)){for(const id in gpHold){gpHold[id]=null;gpFill(id,0)}setActive((active-1+camEls.length)%camEls.length)}
  if(edge(GP_BTN.RB)){for(const id in gpHold){gpHold[id]=null;gpFill(id,0)}setActive((active+1)%camEls.length)}
  // image
  // D-pad: ← / → exposure − / +, ↑ AF, ↓ MF
  if(edge(GP_BTN.RIGHT)&&gpAllowed('img')){evStep(1);gpFlash('#evp')}
  if(edge(GP_BTN.LEFT)&&gpAllowed('img')){evStep(-1);gpFlash('#evm')}
  if(edge(GP_BTN.UP)&&gpAllowed('img')){setFocus({focus_mode:'afc'});gpFlash('.fm[data-f="afc"]')}
  if(edge(GP_BTN.DOWN)&&gpAllowed('img')){setFocus({focus_mode:'mf'});gpFlash('.fm[data-f="mf"]')}
  if(edge(GP_BTN.RS)&&gpAllowed('img')){setFocus({focus_mode:'afs'});gpFlash('.fm[data-f="afs"]')}
  gpPrev=p.buttons.map(b=>b.pressed);
}
renderGp();requestAnimationFrame(gpLoop);
</script>
