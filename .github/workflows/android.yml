# File keeps its original name (android.yml) so the run number, which sets version and tag, keeps counting.
name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  SEA_FUSE: NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version
        run: |
          V="0.9.${GITHUB_RUN_NUMBER}"
          sed -i.bak "s/const APP_VERSION='0.9';/const APP_VERSION='$V';/" ptz.html
          sed -i.bak "s/const VERSION = '0.9';/const VERSION = '$V';/" bridge/bridge.js
          grep -q "APP_VERSION='$V'" ptz.html && grep -q "VERSION = '$V'" bridge/bridge.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copy controller page into the app
        run: |
          mkdir -p android/app/src/main/assets/www
          cp ptz.html android/app/src/main/assets/www/index.html
      - name: Signing key
        env:
          KS_B64: ${{ secrets.PTZ_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.PTZ_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then echo "::error::Missing secrets PTZ_KEYSTORE_B64 / PTZ_KEYSTORE_PASSWORD"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ptz-release.p12"
          echo "PTZ_KEYSTORE=$RUNNER_TEMP/ptz-release.p12" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        env:
          PTZ_KEYSTORE_PASSWORD: ${{ secrets.PTZ_KEYSTORE_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$SIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signer.txt | grep -i "SHA-256"
          grep -qi "5e2e4bc5bc6c6023f483a9069f3518048d08692228b2a38a0b69b6e8beabd1a1" signer.txt
      - run: cp android/app/build/outputs/apk/release/app-release.apk PTZ-Controller.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: PTZ-Controller.apk

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version
        run: |
          V="0.9.${GITHUB_RUN_NUMBER}"
          sed -i.bak "s/const APP_VERSION='0.9';/const APP_VERSION='$V';/" ptz.html
          sed -i.bak "s/const VERSION = '0.9';/const VERSION = '$V';/" bridge/bridge.js
          grep -q "APP_VERSION='$V'" ptz.html && grep -q "VERSION = '$V'" bridge/bridge.js
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Bundle PTZ Bridge
        run: |
          cp ptz.html bridge/public/index.html
          node bridge/packaging/bundle.js
          node --experimental-sea-config bridge/packaging/sea-config.json
      - name: Build universal binary (Apple silicon + Intel)
        run: |
          V=$(node -p process.version)
          cp "$(command -v node)" node-arm64
          curl -fsSL "https://nodejs.org/dist/$V/node-$V-darwin-x64.tar.gz" | tar xz
          cp "node-$V-darwin-x64/bin/node" node-x64
          for b in node-arm64 node-x64; do
            codesign --remove-signature "$b"
            npx --yes postject@1.0.0-alpha.6 "$b" NODE_SEA_BLOB sea-prep.blob --sentinel-fuse "$SEA_FUSE" --macho-segment-name NODE_SEA
          done
          lipo -create -output ptz-bridge node-arm64 node-x64
          lipo -info ptz-bridge
      - name: Build PTZ Bridge.app and .dmg
        run: |
          APP="dmg/PTZ Bridge.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp ptz-bridge "$APP/Contents/MacOS/ptz-bridge"
          sed -e "s/__VERSION__/0.9.${GITHUB_RUN_NUMBER}/" -e "s/__BUILD__/${GITHUB_RUN_NUMBER}/" bridge/packaging/Info.plist > "$APP/Contents/Info.plist"
          mkdir AppIcon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s bridge/packaging/icon.png --out AppIcon.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) bridge/packaging/icon.png --out AppIcon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"
          ln -s /Applications dmg/Applications
          hdiutil create -volname "PTZ Bridge" -srcfolder dmg -ov -format UDZO PTZ-Bridge-mac.dmg
      - name: Smoke test
        run: |
          PTZ_NO_BROWSER=1 "dmg/PTZ Bridge.app/Contents/MacOS/ptz-bridge" &
          sleep 3
          curl -fsS http://localhost:8080/api/status
          curl -fsS -o /dev/null http://localhost:8080/admin
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsS -X POST http://localhost:8080/api/quit
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: PTZ-Bridge-mac.dmg

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version
        run: |
          V="0.9.${GITHUB_RUN_NUMBER}"
          sed -i.bak "s/const APP_VERSION='0.9';/const APP_VERSION='$V';/" ptz.html
          sed -i.bak "s/const VERSION = '0.9';/const VERSION = '$V';/" bridge/bridge.js
          grep -q "APP_VERSION='$V'" ptz.html && grep -q "VERSION = '$V'" bridge/bridge.js
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Bundle PTZ Bridge
        run: |
          cp ptz.html bridge/public/index.html
          node bridge/packaging/bundle.js
          node --experimental-sea-config bridge/packaging/sea-config.json
      - name: Build PTZ-Bridge.exe
        run: |
          node -e "require('fs').copyFileSync(process.execPath, 'PTZ-Bridge.exe')"
          curl -fsSL -o rcedit.exe https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe
          ./rcedit.exe PTZ-Bridge.exe --set-icon bridge/packaging/icon.ico \
            --set-version-string ProductName "PTZ Bridge" --set-version-string FileDescription "PTZ Bridge" \
            --set-version-string CompanyName "budeme.live" --set-version-string OriginalFilename "PTZ-Bridge.exe" \
            --set-version-string InternalName "PTZ Bridge" --set-file-version "0.9.${GITHUB_RUN_NUMBER}" --set-product-version "0.9.${GITHUB_RUN_NUMBER}"
          npx --yes postject@1.0.0-alpha.6 PTZ-Bridge.exe NODE_SEA_BLOB sea-prep.blob --sentinel-fuse "$SEA_FUSE"
      - name: Smoke test
        run: |
          PTZ_NO_BROWSER=1 ./PTZ-Bridge.exe > bridge.log 2>&1 &
          ok=0
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:8080/api/status; then ok=1; break; fi; sleep 1; done
          echo; echo "--- bridge.log ---"; cat bridge.log
          [ $ok = 1 ]
          curl -fsS -o /dev/null http://127.0.0.1:8080/admin
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          curl -fsS -X POST http://127.0.0.1:8080/api/quit
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: PTZ-Bridge.exe

  release:
    needs: [android, mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Stamp version
        working-directory: src
        run: |
          V="0.9.${GITHUB_RUN_NUMBER}"
          sed -i.bak "s/const APP_VERSION='0.9';/const APP_VERSION='$V';/" ptz.html
          sed -i.bak "s/const VERSION = '0.9';/const VERSION = '$V';/" bridge/bridge.js
          grep -q "APP_VERSION='$V'" ptz.html && grep -q "VERSION = '$V'" bridge/bridge.js
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: cp src/ptz.html ptz.html
      - run: ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.${{ github.run_number }}
          name: PTZ OBSBOT Controller 0.9.${{ github.run_number }}
          make_latest: true
          files: |
            PTZ-Controller.apk
            PTZ-Bridge-mac.dmg
            PTZ-Bridge.exe
            ptz.html
          body: |
            **PTZ-Controller.apk** – Android aplikácia pre tablet, kamery aj tally pripojí priamo.
            **PTZ-Bridge-mac.dmg** – PTZ Bridge pre macOS 12+ (Apple silicon aj Intel), tally pre HTML ovládač.
            **PTZ-Bridge.exe** – PTZ Bridge pre Windows 10/11, tally pre HTML ovládač.
            **ptz.html** – ovládač ako jeden súbor pre Chrome.
