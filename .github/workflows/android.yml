name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copy controller page into the app
        run: |
          mkdir -p android/app/src/main/assets/www
          cp ptz.html android/app/src/main/assets/www/index.html

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk PTZ-Controller.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PTZ-Controller
          path: PTZ-Controller.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: PTZ Controller 0.1.${{ github.run_number }}
          make_latest: true
          files: PTZ-Controller.apk
          body: |
            Android APK pre tablet. Stiahni PTZ-Controller.apk a nainštaluj.
            Android APK for tablets. Download PTZ-Controller.apk and install it.
